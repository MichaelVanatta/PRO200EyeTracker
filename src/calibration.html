<!DOCTYPE html>
<html>
    <head>
        <title>Calibration</title>
        <link rel="stylesheet" href="assets/styles/css/calibration.css"/>
        <script src="js/webgazer.js"></script>
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.j"></script>
        <script src="js/calibration.js"></script>
    </head>
    <body>
        <div id="calibration">
            <div class="calib-dot" id="Pt1" style="top:10%; left:10%;"></div>
            <div class="calib-dot" id="Pt2" style="top:10%; left:50%;"></div>
            <div class="calib-dot" id="Pt3" style="top:10%; left:90%;"></div>

            <div class="calib-dot" id="Pt4" style="top:50%; left:10%;"></div>
            <div class="calib-dot" id="Pt5" style="top:50%; left:50%;"></div>
            <div class="calib-dot" id="Pt6" style="top:50%; left:90%;"></div>

            <div class="calib-dot" id="Pt7" style="top:90%; left:10%;"></div>
            <div class="calib-dot" id="Pt8" style="top:90%; left:50%;"></div>
            <div class="calib-dot" id="Pt9" style="top:90%; left:90%;"></div>
        </div>
    </body>
</html>
